<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Mugerwa Marvin</title>
    <!-- Link to your main CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Extra CSS just for the dashboard -->
    <style>
        body { padding: 40px 20px; background: var(--bg); }
        .admin-container { max-width: 1000px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .message-table { 
            width: 100%; border-collapse: collapse; background: var(--surface); 
            border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
        }
        .message-table th { 
            background: var(--navy); color: #fff; padding: 16px; 
            text-align: left; font-weight: 500; font-size: 0.9rem; 
        }
        .message-table td { 
            padding: 16px; border-bottom: 1px solid var(--line); 
            color: var(--ink-soft); font-size: 0.95rem; vertical-align: top;
        }
        .message-table tr:hover { background: var(--surface-2); }
        .message-table td:first-child { white-space: nowrap; font-size: 0.85rem; }
        .message-table strong { color: var(--ink); font-weight: 600; }
        
        .status-box { 
            text-align: center; padding: 40px; background: var(--surface); 
            border-radius: 12px; border: 1px dashed var(--line); color: var(--ink-soft);
        }
    </style>
</head>
<body data-theme="light">
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1 style="font-family: 'Fraunces', serif; color: var(--ink); margin-bottom: 8px;">Client Inbox</h1>
                <p style="color: var(--ink-soft);">Messages sent from your website contact form.</p>
            </div>
            <a href="index.html" class="btn btn-outline">← Back to Website</a>
        </div>

        <div id="messages-container">
            <div class="status-box">
                <p>Fetching secure messages from the database...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Admin Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

      // Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyD6iItiAiyAo0czgZJpsDlZgoluWhFSv-4",
  authDomain: "marvin-portfolio-e525d.firebaseapp.com",
  projectId: "marvin-portfolio-e525d",
  storageBucket: "marvin-portfolio-e525d.firebasestorage.app",
  messagingSenderId: "867224014009",
  appId: "1:867224014009:web:c2a5688e39b1b58d501f68"
};


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const container = document.getElementById('messages-container');

        async function loadMessages() {
            try {
                // Query the 'messages' collection, newest first
                const q = query(collection(db, "messages"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                if(querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="status-box">
                            <h3 style="color: var(--ink); margin-bottom: 8px;">Your inbox is empty</h3>
                            <p>When a client fills out the contact form, their message will appear here.</p>
                        </div>`;
                    return;
                }

                let html = `<table class="message-table">
                    <thead>
                        <tr><th>Date</th><th>Client Name</th><th>Email</th><th>Project Details</th></tr>
                    </thead>
                    <tbody>`;
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleString() : "Just now";
                    html += `<tr>
                        <td>${date}</td>
                        <td><strong>${data.name}</strong></td>
                        <td><a href="mailto:${data.email}" style="color: var(--gold); text-decoration: none;">${data.email}</a></td>
                        <td>${data.message}</td>
                    </tr>`;
                });
                
                html += `</tbody></table>`;
                container.innerHTML = html;

            } catch (error) {
                console.error("Error fetching data: ", error);
                container.innerHTML = `
                    <div class="status-box" style="border-color: red; color: red;">
                        <h3>Connection Error</h3>
                        <p>Could not connect to the database. Check your API keys and Firestore rules.</p>
                    </div>`;
            }
        }

        loadMessages();
    </script>
</body>
</html>
